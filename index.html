<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <style>
    :root { --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #86868b; --accent: #0071e3; --border: #e0e0e5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --card: #1c1c1e; --text: #f5f5f7; --muted: #8e8e93; --accent: #0a84ff; --border: #333; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 28px; margin: 0 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text] { flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); }
    button { padding: 10px 14px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 10px; border: 1px solid var(--border); }
    li { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: 0; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: var(--muted); }
    li button { background: transparent; color: var(--muted); padding: 4px 8px; }
    .empty { padding: 16px; color: var(--muted); text-align: center; }
    footer { margin-top: 12px; color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; }
    footer button { background: transparent; color: var(--accent); padding: 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="form">
      <input id="input" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <footer>
      <span id="count"></span>
      <button id="clear" type="button">Clear completed</button>
    </footer>
  </main>
  <script>
    const KEY = 'todos';
    let todos = [];
    try { todos = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}

    const $ = id => document.getElementById(id);

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(todos)); } catch {}
    }

    function render() {
      const list = $('list');
      list.innerHTML = '';
      if (!todos.length) {
        list.innerHTML = '<li class="empty">Nothing yet — add a task above.</li>';
      }
      todos.forEach((t, i) => {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.done;
        cb.onchange = () => { t.done = cb.checked; update(); };
        const span = document.createElement('span');
        span.textContent = t.text;
        const del = document.createElement('button');
        del.textContent = '✕';
        del.setAttribute('aria-label', 'Delete');
        del.onclick = () => { todos.splice(i, 1); update(); };
        li.append(cb, span, del);
        list.append(li);
      });
      const left = todos.filter(t => !t.done).length;
      $('count').textContent = `${left} item${left === 1 ? '' : 's'} left`;
    }

    function update() { save(); render(); }

    $('form').onsubmit = e => {
      e.preventDefault();
      const text = $('input').value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      $('input').value = '';
      update();
    };
    $('clear').onclick = () => { todos = todos.filter(t => !t.done); update(); };

    render();
  </script>
</body>
</html>
