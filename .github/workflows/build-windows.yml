name: Build Windows app

on:
  push:
    branches: [claude/simple-web-app-iao9dw]
    paths: ["bourse_dashboard/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bourse_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bourse_dashboard
        shell: pwsh
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller

      - name: Bundle app with PyInstaller
        run: pyinstaller --noconfirm packaging/BourseDashboard.spec

      - name: Smoke test the bundled exe
        run: |
          $p = Start-Process dist\BourseDashboard\BourseDashboard.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              if ((Invoke-WebRequest http://localhost:8501/_stcore/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep 2
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Write-Error "dashboard did not start"; exit 1 }

      - name: Build installer
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Portable zip
        run: Compress-Archive -Path dist\BourseDashboard -DestinationPath dist\BourseDashboard-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BourseDashboard-${{ env.APP_VERSION }}
          path: |
            bourse_dashboard/dist/BourseDashboard-Setup.exe
            bourse_dashboard/dist/BourseDashboard-Portable.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: داشبورد بورس ${{ env.APP_VERSION }}
          make_latest: true
          files: |
            bourse_dashboard/dist/BourseDashboard-Setup.exe
            bourse_dashboard/dist/BourseDashboard-Portable.zip
          body: |
            ## نصب روی ویندوز
            1. فایل **BourseDashboard-Setup.exe** را دانلود و اجرا کنید (نیازی به نصب پایتون نیست).
            2. اگر ویندوز پیام «Windows protected your PC» داد، روی **More info** و سپس **Run anyway** بزنید.
            3. از آیکون «Bourse Dashboard» روی دسکتاپ برنامه را باز کنید؛ داشبورد در مرورگر باز می‌شود.

            نسخه بدون نصب: **BourseDashboard-Portable.zip** را از حالت فشرده خارج کنید و `BourseDashboard.exe` را اجرا کنید.
